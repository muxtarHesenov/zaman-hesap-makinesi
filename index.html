<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/animasyon.css"> 
    <title id="appTitle">Zaman Farkı Hesaplayıcı</title>
    <link id="logo" rel="shortcut icon" sizes="64x64" type="image/png" href="./IMG/test-logo(real).png" />
</head>

<body>

    <div class="rain-animation">
        
        <div class="raindrop" style="--x-start: 10vw; --duration: 1.2s; --delay: 0.5s; --size: 2px;"></div>
        <div class="raindrop" style="--x-start: 25vw; --duration: 1.5s; --delay: 2s; --size: 3px;"></div>
        <div class="raindrop" style="--x-start: 5vw; --duration: 1.1s; --delay: 1s; --size: 2px;"></div>
        <div class="raindrop" style="--x-start: 40vw; --duration: 1.8s; --delay: 3.5s; --size: 2.5px;"></div>
        <div class="raindrop" style="--x-start: 60vw; --duration: 1.3s; --delay: 0s; --size: 3px;"></div>
        <div class="raindrop" style="--x-start: 75vw; --duration: 1.6s; --delay: 2.5s; --size: 2px;"></div>
        <div class="raindrop" style="--x-start: 90vw; --duration: 1.0s; --delay: 1.5s; --size: 2.5px;"></div>
        <div class="raindrop" style="--x-start: 15vw; --duration: 1.9s; --delay: 4s; --size: 3.5px;"></div>
        <div class="raindrop" style="--x-start: 35vw; --duration: 1.25s; --delay: 0.8s; --size: 2px;"></div>
        <div class="raindrop" style="--x-start: 50vw; --duration: 1.55s; --delay: 3s; --size: 2.8px;"></div>
        <div class="raindrop" style="--x-start: 80vw; --duration: 1.35s; --delay: 1.8s; --size: 2.2px;"></div>
        <div class="raindrop" style="--x-start: 20vw; --duration: 1.65s; --delay: 4.2s; --size: 3px;"></div>
        <div class="raindrop" style="--x-start: 70vw; --duration: 1.05s; --delay: 0.2s; --size: 2px;"></div>
        <div class="raindrop" style="--x-start: 55vw; --duration: 1.85s; --delay: 3.8s; --size: 3.2px;"></div>
        <div class="raindrop" style="--x-start: 45vw; --duration: 1.4s; --delay: 2.8s; --size: 2.5px;"></div>
        <div class="raindrop" style="--x-start: 85vw; --duration: 1.15s; --delay: 1.3s; --size: 2px;"></div>
        <div class="raindrop" style="--x-start: 30vw; --duration: 1.95s; --delay: 3.3s; --size: 3px;"></div>
        <div class="raindrop" style="--x-start: 65vw; --duration: 1.1s; --delay: 0.7s; --size: 2.7px;"></div>
        <div class="raindrop" style="--x-start: 95vw; --duration: 2.0s; --delay: 4.5s; --size: 3.5px;"></div>
        <div class="raindrop" style="--x-start: 2vw; --duration: 1.0s; --delay: 0.1s; --size: 2px;"></div>
        
        <div class="raindrop" style="--x-start: 12vw; --duration: 1.1s; --delay: 0.3s; --size: 2.1px;"></div>
        <div class="raindrop" style="--x-start: 27vw; --duration: 1.6s; --delay: 2.3s; --size: 3.1px;"></div>
        <div class="raindrop" style="--x-start: 7vw; --duration: 1.3s; --delay: 1.3s; --size: 2.1px;"></div>
        <div class="raindrop" style="--x-start: 42vw; --duration: 1.9s; --delay: 3.8s; --size: 2.6px;"></div>
        <div class="raindrop" style="--x-start: 62vw; --duration: 1.4s; --delay: 0.3s; --size: 3.1px;"></div>
        <div class="raindrop" style="--x-start: 77vw; --duration: 1.7s; --delay: 2.8s; --size: 2.1px;"></div>
        <div class="raindrop" style="--x-start: 92vw; --duration: 1.05s; --delay: 1.8s; --size: 2.6px;"></div>
        <div class="raindrop" style="--x-start: 17vw; --duration: 2.0s; --delay: 4.3s; --size: 3.6px;"></div>
        <div class="raindrop" style="--x-start: 37vw; --duration: 1.35s; --delay: 1.1s; --size: 2.1px;"></div>
        <div class="raindrop" style="--x-start: 52vw; --duration: 1.75s; --delay: 3.3s; --size: 2.9px;"></div>
    
    
        </div>
    
        <div class="falling-leaves">
    <div class="leaf" style="
        left: 10%; font-size: 35px; --duration: 18s; --x-start: 0px; --x-mid: -40px; --x-end: -10px; --z-start: 10deg; --z-mid: 180deg; --z-end: 360deg; 
        --hue-rotate: -15deg;  /* Koyu Kırmızı/Bordo */
        --saturate: 180%; --brightness: 75%; /* Doygun ve Koyu */
        animation-delay: 3s;">🍁</div>
    
    <div class="leaf" style="
        left: 30%; font-size: 30px; --duration: 20s; --x-start: 10px; --x-mid: -20px; --x-end: 0px; --z-start: -20deg; --z-mid: 0deg; --z-end: 360deg; 
        --hue-rotate: 10deg;   /* Parlak Sarı/Turuncu */
        --saturate: 160%; --brightness: 110%; /* Parlak */
        animation-delay: 8s;">🍁</div>
    
    <div class="leaf" style="
        left: 50%; font-size: 25px; --duration: 22s; --x-start: -10px; --x-mid: -10px; --x-end: 10px; --z-start: 5deg; --z-mid: 180deg; --z-end: 540deg; 
        --hue-rotate: -35deg;  /* Kahverengi Tonu */
        --saturate: 100%; --brightness: 65%; /* Doygunluk ve Parlaklık Düşük = Kahve */
        animation-delay: 1s;">🍁</div>

    <div class="leaf" style="
        left: 60%; font-size: 32px; --duration: 24s; --x-start: 5px; --x-mid: 5px; --x-end: -5px; --z-start: 0deg; --z-mid: 360deg; --z-end: 720deg; 
        --hue-rotate: 0deg;    /* Saf Kırmızımsı Turuncu */
        --saturate: 140%; --brightness: 95%; /* Standart Sonbahar */
        animation-delay: 3s;">🍁</div>
    
    <div class="leaf" style="
        left: 70%; font-size: 28px; --duration: 26s; --x-start: 0px; --x-mid: 20px; --x-end: 10px; --z-start: 30deg; --z-mid: 180deg; --z-end: 540deg; 
        --hue-rotate: -25deg;  /* Koyu Kırmızı/Şarap Rengi */
        --saturate: 200%; --brightness: 80%; /* Çok Doygun Kırmızı */
        animation-delay: 9s;">🍁</div>
    
    <div class="leaf" style="
        left: 80%; font-size: 38px; --duration: 28s; --x-start: -5px; --x-mid: 10px; --x-end: 0px; --z-start: -10deg; --z-mid: 0deg; --z-end: 360deg; 
        --hue-rotate: 5deg;    /* Hardal Sarı */
        --saturate: 120%; --brightness: 105%; /* Sarıya Kaykın */
        animation-delay: 2s;">🍁</div>

    <div class="leaf" style="
        left: 15%; font-size: 27px; --duration: 30s; --x-start: -10px; --x-mid: 40px; --x-end: 20px; --z-start: 50deg; --z-mid: 360deg; --z-end: 720deg; 
        --hue-rotate: -5deg;   /* Kırmızı Turuncu */
        --saturate: 140%; --brightness: 90%; 
        animation-delay: 6s;">🍁</div>
    
    <div class="leaf" style="
        left: 45%; font-size: 34px; --duration: 32s; --x-start: 0px; --x-mid: 50px; --x-end: 10px; --z-start: 0deg; --z-mid: 180deg; --z-end: 540deg; 
        --hue-rotate: -30deg;  /* Koyu Kahverengi/Kirli Kahve */
        --saturate: 100%; --brightness: 60%; /* En Koyu Ton */
        animation-delay: 10s;">🍁</div>
    
    <div class="leaf" style="
        left: 90%; font-size: 29px; --duration: 34s; --x-start: 10px; --x-mid: 30px; --x-end: 0px; --z-start: -15deg; --z-mid: 0deg; --z-end: 360deg; 
        --hue-rotate: 15deg;   /* Parlak Sarı */
        --saturate: 180%; --brightness: 110%;
        animation-delay: 4s;">🍁</div>

</div>

    <div class="container">
        
        <div class="language-selector">
            <button class="lang-btn active" data-lang="tr" id="tr-btn"><img src="./IMG/TR.png" alt=""></button>
            <button class="lang-btn" data-lang="ru" id="ru-btn"><img src="./IMG/RU.png" alt=""></button>
        </div>

        <h1 id="mainTitle">Zaman Farkı Hesaplayıcı</h1>
        
        <div class="input-group">
            <input type="text" id="time1" placeholder="İlk Zaman (örn: 00:59:23)">
            <button class="paste-btn" data-target="time1" title="Paste">
                Paste
            </button>
        </div>

        <div class="input-group">
            <input type="text" id="time2" placeholder="İkinci Zaman (örn: 01:45:35)">
            <button class="paste-btn" data-target="time2" title="Paste">
                Paste
            </button>
        </div>
        
        <div class="result" id="result"></div>
        
        <div class="comment-section">
            <p id="commentOutput"></p>
            <button id="copyCommentBtn" class="small-copy-btn" style="display: none;">📋</button>
        </div>

        <button id="copyBtn">📋 Kopyala</button>
        <button id="clearBtn">🧹 Temizle</button>
        
        <input type="text" id="hiddenCopyInput" style="position: absolute; left: -9999px;">
        <input type="text" id="hiddenCommentCopyInput" style="position: absolute; left: -9999px;">
    </div>
      
</body>

</html>
<script src="./js/index.js"></script>

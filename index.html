<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title id="appTitle">Zaman Farkı Hesaplayıcı</title>
    <link id="logo" rel="shortcut icon" sizes="64x64" type="image/png" href="./IMG/test-logo(real).png" />
</head>

<body>
    <div class="container">
        
        <div class="language-selector">
            <button class="lang-btn active" data-lang="tr" id="tr-btn"><img src="./IMG/TR.png" alt=""></button>
            <button class="lang-btn" data-lang="ru" id="ru-btn"><img src="./IMG/RU.png" alt=""></button>
        </div>

        <h1 id="mainTitle">Zaman Farkı Hesaplayıcı</h1>
        
        <input type="text" id="time1" placeholder="İlk Zaman (örn: 00:59:23)">
        <input type="text" id="time2" placeholder="İkinci Zaman (örn: 01:45:35)">
        <div class="result" id="result"></div>
        
        <div class="comment-section">
            <p id="commentOutput"></p>
            <button id="copyCommentBtn" class="small-copy-btn" style="display: none;">📋</button>
        </div>

        <button id="copyBtn">📋 Kopyala</button>
        <button id="clearBtn">🧹 Temizle</button>
        
        <input type="text" id="hiddenCopyInput" style="position: absolute; left: -9999px;">
        <input type="text" id="hiddenCommentCopyInput" style="position: absolute; left: -9999px;">
    </div>
      
</body>

</html>
<script src="./js/index.js"></script>
